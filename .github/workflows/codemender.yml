name: CodeMender Testing

on:
  workflow_dispatch: 

jobs:
  CodeMender-Scan:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write   # Required for the GCP auth inside your composite action

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fake Install CodeMender
        run: |
          mkdir -p ~/.codemender
          cat << 'EOF' > ~/.codemender/config.yaml
          server: {}

          scan:
            extensions:
              include: [".py", ".java", ".go", ".js", ".ts", ".c", ".cc", ".cpp", ".h", ".rb", ".php"]
              exclude: [".min.js", ".generated.go", ".pb.go"]
            max_file_size_kb: 500
            incremental: true

          # Restrict agent file access to these directories (all commands).
          # When empty, the scan target directory is used as the boundary.
          # project_paths:
          #   - "/path/to/project"
          #   - "/path/to/shared-lib"

          output:
            format: table   # "table", "json", "sarif"

          tools:
            confirm_commands: true   # Prompt Y/N before running shell commands (default: true)
            confirm_writes: true     # Prompt Y/N before writing/modifying files (default: true)
            # Use --yes flag on find/fix/session resume to skip all confirmations

          vcs:
            type: ""               # VCS type: "git", "mercurial", "custom", or "" (auto-detect)
            commands:
              reset: ""            # Shell command to reset codebase (auto-populated for known VCS)
              diff: ""             # Shell command to show changes (auto-populated for known VCS)
              status: ""           # Shell command to list modified files (auto-populated for known VCS)
              stage: ""            # Shell command to stage changes (auto-populated for known VCS)
            # Known VCS types (git, mercurial) auto-populate commands.
            # For custom VCS, you MUST set the commands above.
            # Examples:
            #   type: git           # uses: git checkout HEAD -- . && git clean -fd
            #   type: mercurial     # uses: hg revert --all --no-backup && hg purge
            #   type: custom
            #   commands:
            #     reset: "./scripts/reset.sh"
            #     diff: "diff -rq baseline/ current/"
            #     stage: "git add -A"

          build:
            command: ""              # Shell command to build/verify changes from the agent
            # Examples:
            #   Make:       "make build && make test"
            #   Go:         "go build ./... && go test ./..."
            #   Custom:     "./scripts/verify.sh"
          EOF
          

      - name: Update config.yaml with file types
        shell: python
        run: |
          import os
          import yaml
  
          config_file = os.path.expanduser('~/.codemender/config.yaml')
          
          # 1. Discover all unique file extensions, excluding .git
          extensions = set()
          for root, _, files in os.walk('.'):
              if '.git' in root:
                  continue
              for file in files:
                  _, ext = os.path.splitext(file)
                  if ext:
                      extensions.add(ext)
  
          # 2. Load existing config
          if os.path.exists(config_file):
              with open(config_file, 'r') as f:
                  config = yaml.safe_load(f) or {}
          else:
              config = {}
  
          # Ensure the list key exists (assuming the key is 'file_types')
          list_key = 'include'
          if list_key not in config['scan']['extensions'] or config['scan']['extensions'][list_key] is None:
              config['scan']['extensions'][list_key] = []
  
          # 3. Add new extensions
          updated = False
          for ext in extensions:
              if ext not in config['scan']['extensions'][list_key]:
                  config['scan']['extensions'][list_key].append(ext)
                  updated = True
  
          # 4. Write back if changes were made
          if updated:
              with open(config_file, 'w') as f:
                  yaml.dump(config, f, default_flow_style=False)
              print(f"Updated {config_file} with new extensions.")
          else:
              print("No new extensions found.")

      # Print the config file to check results
      - name: Print config.yaml
        shell: bash
        run: cat ~/.codemender/config.yaml

      - name: cm find
        uses: codemender-demo/cm-find@v0.1
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

